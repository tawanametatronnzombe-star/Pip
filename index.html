<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FFF6E6">
<meta name="description" content="Pip is a cozy, friendly chat companion.">
<title>Pip - your cozy chat friend</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='52' r='38' fill='%23CDE7F7' stroke='%237DB9E0' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main class="book">

    <header class="top">
      <svg class="logo" id="logo" viewBox="0 0 100 100" role="img" aria-label="Pip the chat friend" data-mood="idle">
        <g class="figure">
          <path class="leaf" d="M50 15C47 6 52 0 60 0c0 8-3 13-10 15z"/>
          <path class="body" d="M50 14c20 0 36 15 36 37 0 21-16 36-36 36S14 72 14 51c0-22 16-37 36-37z"/>
          <g class="e-ok">
            <circle class="eye" cx="37" cy="47" r="4.8"/>
            <circle class="eye" cx="63" cy="47" r="4.8"/>
          </g>
          <g class="e-err">
            <path class="mouth" d="M31 49q6-6 12 0"/>
            <path class="mouth" d="M57 49q6-6 12 0"/>
          </g>
          <circle class="cheek" cx="28" cy="60" r="5.5"/>
          <circle class="cheek" cx="72" cy="60" r="5.5"/>
          <path class="mouth m-idle" d="M40 61q10 10 20 0"/>
          <circle class="mouth m-think" cx="50" cy="64" r="3.6"/>
          <path class="mouth m-err" d="M41 68q9-8 18 0"/>
        </g>
      </svg>
      <div class="title">
        <h1>Pip</h1>
        <p id="status">Ready to chat</p>
      </div>
      <button type="button" class="ghost" id="new">New page</button>
    </header>

    <section id="feed" class="feed" role="log" aria-live="polite" aria-label="Conversation">
      <div id="welcome" class="welcome">
        <div id="bigLogo" class="big"></div>
        <h2>Hello, I am Pip</h2>
        <p>Ask me anything, share a story, or just say hi. I will write back as we go.</p>
        <div class="chips">
          <button type="button" class="chip" data-text="Tell me a short, cozy bedtime story.">A cozy story</button>
          <button type="button" class="chip" data-text="Teach me something surprising about the ocean.">Ocean facts</button>
          <button type="button" class="chip" data-text="Help me plan a relaxing weekend.">Plan my weekend</button>
        </div>
      </div>
    </section>

    <form id="composer" class="composer" autocomplete="off">
      <label for="input" class="sr">Type your message</label>
      <textarea id="input" rows="1" maxlength="4000" placeholder="Write a message here" enterkeyhint="send"></textarea>
      <button type="submit" id="send" class="round" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 12h14M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" id="stop" class="round stop" aria-label="Stop writing" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="3" fill="currentColor"/></svg>
      </button>
    </form>

  </main>
</div>
<script src="script.js"></script>
</body>
</html>
